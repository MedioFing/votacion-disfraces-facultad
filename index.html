<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concurso de Disfraces - Facultad de Ingeniería</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        },
                        spooky: {
                            purple: '#6b21a8',
                            orange: '#f97316',
                            dark: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col selection:bg-spooky-orange selection:text-white">

    <!-- Header / Banner -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md bg-opacity-90">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-spooky-orange text-slate-950 p-2.5 rounded-xl font-extrabold text-xl shadow-lg shadow-spooky-orange/20">
                    <i class="fa-solid fa-ghost"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-black tracking-tight text-white">Concurso de Disfraces 🎃</h1>
                    <p class="text-xs sm:text-sm text-slate-400">Facultad de Ingeniería · Votación Oficial</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="bg-slate-800/80 px-4 py-2 rounded-xl border border-slate-700/60 text-center">
                    <span class="block text-xs text-slate-400 font-medium">Total Votos</span>
                    <span id="total-votes-counter" class="text-lg font-bold text-spooky-orange">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8 sm:px-6 space-y-12">

        <!-- Info / Instructions Banner -->
        <section class="bg-gradient-to-r from-purple-950/40 via-slate-900 to-orange-950/40 border border-purple-500/20 rounded-2xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 text-purple-900/20 text-9xl font-black pointer-events-none">
